packages:
  - apps/*
  - packages/*

# Only packages that genuinely need install scripts may run them.
allowBuilds:
  esbuild: true
  unrs-resolver: false
  msgpackr-extract: false
  # Pulled in by next-intl's optional message extractor (unused); prebuilt binaries suffice.
  "@parcel/watcher": false
  "@swc/core": false
