name: closer

services:
  postgres:
    # Same Postgres major as Supabase, with pgvector preinstalled.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: closer
    ports:
      - "5433:5432"
    volumes:
      - ./packages/db/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d closer"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    # Backs the BullMQ job queues. AOF persistence so queued jobs survive a restart.
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
